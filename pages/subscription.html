<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Box || York Street Coffee</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>
    <nav>
        <span class="brand">York Street Coffee</span>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="product.html">Products</a>
            <a href="information.html">Information</a>
            <a href="cart.html">Cart</a>
            <a href="subscription.html" class="current">Subscription</a>
        </div>
    </nav>

    <main class="subscription-page">
        <h1>Build Your Subscription Box</h1>

        <form id="subscriptionForm">
            <label for="customerName">Name</label>
            <input type="text" id="customerName" name="customerName">

            <label for="customerEmail">Email</label>
            <input type="email" id="customerEmail" name="customerEmail">

            <label>Coffee Details</label>
            <button type="button" id="addCoffeeButton">Add Coffee</button>
            <div id="coffeeList"></div>

            <p>Bakery Add-ons</p>
            <label><input type="checkbox" class="addon" value="Croissant"> Croissant</label>
            <label><input type="checkbox" class="addon" value="Brownie"> Brownie</label>
            <label><input type="checkbox" class="addon" value="Cookie"> Cookie</label>

            <label for="frequency">Delivery Frequency</label>
            <select id="frequency" name="frequency">
                <option value="Weekly">Weekly</option>
                <option value="Fortnightly">Fortnightly</option>
                <option value="Monthly">Monthly</option>
            </select>

            <label><input type="checkbox" id="gift" name="gift"> This is a gift</label>

            <button type="submit">Save Subscription</button>
        </form>

        <div id="formMessage"></div>

        <section class="summary-box">
            <h2>Order Summary</h2>
            <p id="summaryCoffee">Coffees: 0 selected</p>
            <p id="summaryAddons">Add-ons: None</p>
            <p id="summaryFrequency">Delivery: Weekly</p>
            <p id="summaryGift">Gift: No</p>
            <p id="summaryPrice">Price: £0</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 York Street Coffee</p>
    </footer>

    <script src="../scripts/subscription.js"></script>
</body>

</html>
