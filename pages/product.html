<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Speciality || York Street Bakery</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>
    <nav>
        <span class="brand">York Street Coffee</span>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="product.html" class="current">Products</a>
            <a href="information.html">Information</a>
            <a href="cart.html">Cart</a>
            <a href="subscription.html">Subscription</a>
        </div>
    </nav>

    <main class="product-page">
        <section class="product-intro">
            <h1>Small-batch beans and same day bakes!</h1>
        </section>

        <section class="product-controls">
            <div class="filter-buttons" role="group" aria-label="Filter products by category">
                <button type="button" class="filter-button active" data-filter="all">All</button>
                <button type="button" class="filter-button" data-filter="coffee">Coffee</button>
                <button type="button" class="filter-button" data-filter="bakery">Bakery</button>
            </div>

            <div class="search-bar">
                <label for="productSearch" class="visually-hidden">Search products</label>
                <input type="search" id="productSearch" placeholder="Search products...">
            </div>
        </section>
        <p>* Click on my image to reveal my description!</p>
        <section id="productGrid" class="product-grid">
            <!-- Product cards are rendered here by product.js -->
        </section>

        <p id="noResultsMessage" class="no-results" hidden>No products match your search.</p>
    </main>

    <div id="productModal" class="modal-overlay" hidden>
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalProductDescription">
            <button type="button" class="modal-close" aria-label="Close">&times;</button>
            <div class="modal-body">
                <div id="modalProductDescription"></div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 York Street Coffee</p>
    </footer>

    <script src="../scripts/product.js"></script>
</body>

</html>
