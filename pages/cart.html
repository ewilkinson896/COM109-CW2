<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout || York Street Coffee</title>
    <link rel="stylesheet" href="../styles/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <nav>
        <span class="brand">York Street Coffee</span>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="product.html">Products</a>
            <a href="information.html">Information</a>
            <a href="cart.html" class="current">Cart</a>
            <a href="subscription.html">Subscription</a>
        </div>
    </nav>

    <main>
      <h1>Your Cart</h1>
      <p>Review your selections before checkout.</p>

      <section class="cart-section">
        <div class="cart-header">
          <h2>Cart Items</h2>
          <button id="empty-cart" type="button">Empty Cart</button>
        </div>
        <div id="cart-items"></div>
        <div id="cart-summary"></div>
      </section>

      <section class="checkout-section">
        <h2>Checkout</h2>
        <form id="checkout-form" novalidate class="checkout-form">
          <div id="form-errors" hidden></div>

          <label class="form-label">First name: </label>
          <input name="firstName" type="text" class="form-input"/>

          <label class="form-label">Last name: </label>
          <input name="lastName" type="text" class="form-input"/>

          <label class="form-label">Email address: </label>
          <input name="email" type="email" class="form-input" />

          <label class="form-label">Delivery address: </label>
          <input name="street" type="text" class="form-input" />

          <label class="form-label">City: </label>
          <input name="city" type="text" class="form-input" />

          <label class="form-label">Postcode: </label>
          <input name="postcode" type="text" class="form-input" />

          <label class="form-label">Card details: </label>
          <input name="card" type="text" class="form-input" />

          <button type="submit">Place Order</button>
        </form>
      </section>

      <section id="confirmation-section" hidden>
        <h2>Order Confirmed</h2>
        <p id="confirmation-message"></p>
      </section>
    </main>

    <footer>
        <p>&copy; 2026 York Street Coffee</p>
    </footer>

    <script src="../scripts/cart.js"></script>
  </body>
</html>
