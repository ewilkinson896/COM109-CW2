<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout || York Street Coffee</title>
    <link rel="stylesheet" href="../styles/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <nav>
        <span class="brand">York Street Coffee</span>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="product.html">Products</a>
            <a href="information.html">Information</a>
            <a href="cart.html" class="current">Cart</a>
            <a href="subscription.html">Subscription</a>
        </div>
    </nav>

    <main class="cart-page">
      <div class="page-intro">
        <h1>Your Cart</h1>
        <p>Pick up your favourites, review your order and complete checkout in a few simple steps.</p>
      </div>

      <div class="cart-layout">
        <section class="cart-section">
          <div class="cart-header">
            <h2>Cart Items</h2>
            <button id="empty-cart" type="button">Empty Cart</button>
          </div>
          <div id="cart-items"></div>
          <div id="cart-summary"></div>
        </section>

        <section class="checkout-section">
          <h2>Checkout</h2>
          <form id="checkout-form" novalidate class="checkout-form">
            <div id="form-errors" hidden></div>

            <div class="form-section">
              <h3>Contact details</h3>
              <div class="form-grid">
                <label class="form-label" for="firstName">First name</label>
                <input id="firstName" name="firstName" type="text" class="form-input" />

                <label class="form-label" for="lastName">Last name</label>
                <input id="lastName" name="lastName" type="text" class="form-input" />

                <label class="form-label full" for="email">Email address</label>
                <input id="email" name="email" type="email" class="form-input full" />
              </div>
            </div>

            <div class="form-section">
              <h3>Delivery details</h3>
              <div class="form-grid">
                <label class="form-label full" for="street">Delivery address</label>
                <input id="street" name="street" type="text" class="form-input full" />

                <label class="form-label" for="city">City</label>
                <input id="city" name="city" type="text" class="form-input" />

                <label class="form-label" for="postcode">Postcode</label>
                <input id="postcode" name="postcode" type="text" class="form-input" />
              </div>
            </div>

            <div class="form-section">
              <h3>Payment details</h3>
              <div class="form-grid">
                <label class="form-label full" for="cardNumber">Card number</label>
                <input id="cardNumber" name="cardNumber" type="text" inputmode="numeric" autocomplete="cc-number" class="form-input full" placeholder="1234 5678 9012 3456" />

                <label class="form-label" for="expiry">Expiry date</label>
                <input id="expiry" name="expiry" type="text" autocomplete="cc-exp" class="form-input" placeholder="MM/YY" />

                <label class="form-label" for="cvv">CVV</label>
                <input id="cvv" name="cvv" type="text" inputmode="numeric" autocomplete="cc-csc" class="form-input" placeholder="123" />
              </div>
            </div>

            <button type="submit">Place Order</button>
          </form>
        </section>
      </div>

      <section id="confirmation-section" hidden>
        <h2>Order Confirmed</h2>
        <p id="confirmation-message"></p>
      </section>
    </main>

    <footer>
        <p>&copy; 2026 York Street Coffee</p>
    </footer>

    <script src="../scripts/cart.js"></script>
  </body>
</html>
