<!DOCTYPE html>
<html>

<head>
    <title>Coffee Details</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>
    <nav>
        <a href="../index.html">Home</a>
        <a href="product.html">Product Info</a>
        <a href="form.html">Form</a>
        <a href="cart.html">Cart</a>
        <a href="subscription.html">Subscription</a>
    </nav>

    <main class="subscription-page">
        <h1>Coffee Details</h1>

        <form id="coffeeDetailsForm">
            <label for="coffee">Coffee Type</label>
            <select id="coffee" name="coffee">
                <option value="House Blend">House Blend</option>
                <option value="Colombian Roast">Colombian Roast</option>
                <option value="Espresso Mix">Espresso Mix</option>
            </select>

            <label for="roast">Roast</label>
            <select id="roast" name="roast">
                <option value="Light">Light</option>
                <option value="Medium">Medium</option>
                <option value="Dark">Dark</option>
            </select>

            <label for="grind">Grind Type</label>
            <select id="grind" name="grind">
                <option value="Beans">Beans</option>
                <option value="Coarse">Coarse</option>
                <option value="Fine">Fine</option>
            </select>

            <button type="submit">Add Coffee</button>
        </form>

        <div id="coffeeMessage"></div>
    </main>

    <script src="../scripts/coffee-details.js"></script>
</body>

</html>
